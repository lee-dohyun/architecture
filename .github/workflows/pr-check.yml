# PR 단계 품질 게이트 (Python 정적 사이트)
#
# 왜 필요한가: 이 저장소는 Docker 빌드 게이트가 없고(CD도 없음, 수동 배포), 로컬에만 있던
# Claude PostToolUse 훅(check-i18n-keys.sh/check-mermaid.sh)이 Claude Code 세션 밖에서 커밋된
# 변경(다른 도구, 또는 훅 없는 환경)에는 전혀 걸리지 않았다. 같은 검사를 PR 단계에서도 강제한다.
name: PR Check

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: i18n key consistency
        run: ./.claude/hooks/check-i18n-keys.sh
      - name: Mermaid diagram integrity
        run: ./.claude/hooks/check-mermaid.sh
      - name: Static build
        run: python build_static.py
