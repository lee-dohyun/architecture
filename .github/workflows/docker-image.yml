name: Build and Push Docker Image

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/architecture-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/architecture-web:${{ github.sha }}

      # DevSecOps SCA rollout (architecture#15 / architecture#17): scan the image we just
      # built/pushed for known OS + Python vulnerabilities. Report-only for now —
      # TODO: once findings are triaged, set exit-code: '1' with
      # severity: 'CRITICAL,HIGH' to actually gate the build/deploy. Note: this repo has
      # no CD job (deploys are manual, see CLAUDE.md), so scanning here only produces a
      # report — it does not gate any automated rollout.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/architecture-web:${{ github.sha }}
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "0"

      - name: Upload Trivy scan results as workflow artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-results-${{ github.sha }}
          path: trivy-results.sarif
          retention-days: 30

      - name: Upload Trivy scan results to GitHub Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v4.37.7
        with:
          sarif_file: "trivy-results.sarif"
