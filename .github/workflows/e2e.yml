name: E2E (Playwright)

# 실제 배포된 posselect.com 을 대상으로 핵심 플로우를 검증한다(architecture#11).
# 기본은 읽기 전용 smoke. 쓰기가 있는 flow 는 수동 실행 + allow_writes 일 때만 돈다.
on:
  pull_request:
    paths:
      - 'e2e/**'
      - '.github/workflows/e2e.yml'
  schedule:
    - cron: '0 20 * * *'  # 05:00 KST daily
  workflow_dispatch:
    inputs:
      allow_writes:
        description: 'flow(장바구니 등 운영 쓰기) 도 실행'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npx tsc -p .

      - name: smoke (read-only)
        run: npx playwright test --project=smoke

      - name: flow (writes, manual only)
        if: github.event_name == 'workflow_dispatch' && inputs.allow_writes
        env:
          E2E_ALLOW_WRITES: '1'
        run: npx playwright test --project=flow

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
