# Claude 자동 PR 리뷰
#
# 전제: 저장소(또는 조직) 시크릿에 ANTHROPIC_API_KEY 가 등록되어 있어야 한다.
# 시크릿이 없으면 이 워크플로는 조용히 건너뛴다(아래 if 조건) — PR 자체를 막지는 않는다.
#
# 왜 ubuntu-latest 인가: 이 클러스터의 self-hosted runner(k3s-home)는 배포 전용이며
# 배포용 kubeconfig 에 접근할 수 있다. API 키를 그 러너에 올리면 노출면이 넓어지므로
# 리뷰 잡은 GitHub 호스티드 러너에서 돌린다.
name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: claude-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for API key
        id: guard
        run: |
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ANTHROPIC_API_KEY 시크릿이 없어 Claude 리뷰를 건너뜁니다."
          fi
      - name: Claude review
        if: steps.guard.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            PR 변경분을 리뷰하라. 이 저장소는 leedohyun.com/posselect.com 클러스터의 공개 구조도
            사이트(architecture.leedohyun.com)로, Flask 템플릿 + data/*.json + build_static.py로
            GitHub Pages 정적 미러를 만든다.

            우선 확인할 것:
            1. data/{ko,en,ja,zh}.json 변경 시 4개 언어 키가 고르게 존재하는지. 템플릿이 참조하는 키가
               특정 언어에 없으면 에러 없이 그 언어 화면에서 조용히 빈칸으로 렌더링된다(실제 사고 이력 있음).
            2. mermaid 다이어그램 정의(data/*.json 내 문자열)가 부분 치환으로 라벨이 잘리지 않았는지.
               렌더링 실패는 브라우저에서만 드러나 CI/테스트로 안 잡힌다.
            3. `graph TB`/`graph LR` 같은 mermaid 지시자는 템플릿이 주입하므로 JSON 값 자체에 있으면 안 된다.
            4. CD가 없어 수동 배포다 — 이 PR이 머지되면 누군가 수동으로 반영해야 한다는 점을 놓치지 말 것.

            확실한 결함만 지적할 것.
          claude_args: --model claude-sonnet-5 --max-turns 15
